name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build
        run: msbuild magnifier.vcxproj /p:Configuration=Release /p:Platform=x64

      - name: Stage artifact
        run: cp x64\Release\magnifier.exe magnifier.exe

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: magnifier.exe
          generate_release_notes: true
